<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Nintendo Arcade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
        html, body { width: 100vw; height: 100vh; margin: 0; padding: 0; background: #0d0d12; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #app { width: 100%; max-width: 430px; height: 100%; display: flex; flex-direction: column; background: #15151c; position: relative; }
        #hub-view { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 16px; overflow-y: auto; }
        .hub-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid #282836; margin-bottom: 16px; }
        .hub-title { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; color: #ff4757; }
        .hub-tag { font-size: 11px; background: #252533; color: #8888a0; padding: 4px 8px; border-radius: 6px; font-weight: 600; }
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .game-card { background: #1c1c26; border: 1px solid #2e2e3f; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform .1s, border-color .1s; }
        .game-card:active { transform: scale(0.96); border-color: #ff4757; }
        .game-cover { width: 100%; aspect-ratio: 3/4; background: #000; object-fit: cover; display: block; }
        .game-info { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
        .game-name { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .game-sub { font-size: 10px; color: #888899; }
        #game-view { width: 100%; height: 100%; display: none; flex-direction: column; background: #18181f; position: absolute; top: 0; left: 0; z-index: 10; }
        .game-top-nav { height: 36px; background: #0e0e13; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #252533; flex-shrink: 0; }
        .back-btn { background: #252533; border: 1px solid #3e3e52; color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
        .current-game-title { font-size: 12px; font-weight: 700; color: #ccc; }
        #screen-wrap { width: 100%; height: 46vh; background: #000; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; flex-shrink: 0; }
        canvas#nes { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; transform: translateZ(0); will-change: transform; }
        #pad { width: 100%; flex: 1; padding: clamp(8px, 2.5vw, 14px); background: #18181f; display: flex; flex-direction: column; justify-content: space-around; border-top: 2px solid #272733; position: relative; }
        #top-ctrl { display: flex; justify-content: center; gap: clamp(16px, 4vw, 28px); align-items: center; }
        #top-ctrl button { width: clamp(60px, 18vw, 78px); height: clamp(22px, 5.5vw, 28px); background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .2); border-radius: 14px; box-shadow: 0 2px 4px rgba(0, 0, 0, .6); cursor: pointer; color: #fff; font-size: clamp(9px, 2.2vw, 11px); font-weight: 900; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; transition: transform .06s, background .06s; }
        #top-ctrl button:active, #top-ctrl button.touching { transform: translateY(2px); background: #444; box-shadow: 0 0 0 #000; }
        #main-row { display: flex; justify-content: space-between; align-items: center; padding: 0 6px; gap: clamp(6px, 2vw, 16px); }
        #dpad { display: grid; grid-template-columns: repeat(3, clamp(38px, 11.5vw, 50px)); grid-template-rows: repeat(3, clamp(38px, 11.5vw, 50px)); gap: clamp(3px, 1vw, 5px); background: rgba(0, 0, 0, .35); padding: clamp(4px, 1.2vw, 8px); border-radius: 50%; box-shadow: 0 4px 14px rgba(0, 0, 0, .6); border: 1px solid rgba(255, 255, 255, .1); flex-shrink: 0; }
        #dpad button { background: radial-gradient(circle at 35% 35%, #ff4757, #b33939); color: #fff; border: 1px solid rgba(255, 255, 255, .3); border-radius: clamp(8px, 2vw, 12px); font-size: clamp(16px, 4.5vw, 22px); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #780f1a; cursor: pointer; transition: transform .06s, background .06s; }
        #dpad button:active, #dpad button.touching { background: #e84118 !important; transform: scale(.92) translateY(2px); box-shadow: 0 0 0 #780f1a; }
        #act { display: flex; gap: clamp(10px, 2.8vw, 16px); background: rgba(0, 0, 0, .35); padding: clamp(8px, 2.2vw, 12px) clamp(10px, 3vw, 18px); border-radius: 36px; border: 1px solid rgba(255, 255, 255, .1); align-items: center; box-shadow: 0 4px 14px rgba(0, 0, 0, .6); flex-shrink: 0; }
        #act button { width: clamp(44px, 13vw, 58px); height: clamp(44px, 13vw, 58px); border-radius: 50%; border: none; color: #fff; font-size: clamp(16px, 4.5vw, 20px); font-weight: bold; display: flex; align-items: center; justify-content: center; background: #ff4757; box-shadow: 0 4px #b33939; cursor: pointer; transition: transform .06s, background .06s; }
        #act button:active, #act button.touching { transform: scale(.92) translateY(3px); background: #e84118 !important; box-shadow: 0 1px #b33939; }
    </style>
</head>
