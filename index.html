<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>Kanara Arcade - 5 Column Hub</title>
    <base href="https://game.kanara.my.id/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-page: #98b2c4;
            --color-paper: #98b2c4;
            --color-card: #ffffff;
            --color-muted: #204961;
            --color-green-soft: #d8e2e8;
            --color-green-mid: #98b2c4;
            --color-yellow: #ffb703;
            --color-forest: #204961;
            --color-line: #7e9bb0;
            --ink: #1f1f1f;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100vw;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #98b2c4;
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
            color: var(--ink);
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        body.in-game {
            overflow: hidden !important;
            height: 100vh !important;
            height: 100dvh !important;
            touch-action: none;
        }

        #app {
            width: 100%;
            max-width: 100vw;
            min-height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background-color: #98b2c4;
            position: relative;
        }

        /* ===== HUB VIEW 5 KOLOM DESKTOP STYLE ===== */
        #hub-view {
            width: 100%;
            max-width: 100vw;
            display: flex;
            flex-direction: column;
            padding: 16px 16px 48px;
            gap: 16px;
            box-sizing: border-box;
        }
        .search-wrap {
            position: sticky;
            top: 10px;
            z-index: 50;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }
        .search-input {
            width: 100%;
            height: 48px;
            background: #ffffff;
            border: 2px solid var(--color-line);
            border-radius: 20px;
            padding: 0 18px 0 46px;
            color: var(--ink);
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: var(--color-forest);
        }
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-muted);
            pointer-events: none;
        }

        /* 5 Kolom Penuh Desktop Arcade Hub */
        .cart-grid {
            display: grid !important;
            grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
            gap: 12px;
            width: 100%;
        }
        @media (max-width: 600px) {
            .cart-grid {
                grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
                gap: 6px;
            }
            #hub-view {
                padding: 10px 8px 36px;
            }
            .cart {
                padding: 5px !important;
                border-radius: 12px !important;
            }
            .cart-name {
                font-size: 10px !important;
                height: 24px !important;
            }
            .cart-meta {
                display: none;
            }
        }

        .cart {
            width: 100%;
            min-width: 0;
            position: relative;
            background: #ffffff;
            border: 1.5px solid var(--color-line);
            border-radius: 18px;
            padding: 8px;
            cursor: pointer;
            text-align: left;
            overflow: hidden;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            transition: transform 0.12s ease, background 0.12s ease;
        }
        .cart:active {
            transform: scale(0.96);
            background: var(--color-green-soft);
        }
        .cart-window {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(135deg, #204961, #366580);
            border: 1.5px solid var(--color-line);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cart-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #d8e2e8;
            padding: 4px;
            text-align: center;
        }
        .cart-placeholder svg {
            width: 24px;
            height: 24px;
            fill: #ffb703;
        }
        .cart-placeholder span {
            font-size: 9px;
            font-weight: 800;
            line-height: 1.15;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .cart-window img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.2s ease-in;
        }
        .cart-window img.loaded {
            opacity: 1;
        }
        .cart-label {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .cart-name {
            font-size: 11px;
            font-weight: 800;
            color: var(--ink);
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 28px;
        }
        .cart-meta {
            font-size: 9px;
            font-weight: 700;
            color: var(--color-forest);
            letter-spacing: .2px;
        }

        .hub-footer {
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--color-muted);
            font-size: 12px;
            font-weight: 800;
            font-family: 'Space Grotesk', sans-serif;
        }

        /* ===== GAME VIEW ===== */
        #game-view {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #11151a;
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px 14px;
            box-sizing: border-box;
            touch-action: none;
        }
        #game-view.active {
            display: flex !important;
        }

        .game-top-bar {
            width: 100%;
            max-width: 440px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 4px;
            z-index: 10;
        }
        .game-title-header {
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }
        .top-ctrls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-ctrl {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-ctrl:active, .btn-ctrl.touching {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(1px);
        }

        #cabinet {
            position: relative;
            width: 100%;
            max-width: 440px;
            flex: 1;
            max-height: 48vh;
            aspect-ratio: 256 / 240;
            background: #000;
            border-radius: 12px;
            border: 2.5px solid #2f3e46;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 2px 0;
        }
        canvas#nes {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            image-rendering: pixelated;
        }
        .rom-loading-box {
            position: absolute;
            inset: 0;
            background: rgba(10, 14, 18, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #ffffff;
            font-family: monospace;
            padding: 16px;
            text-align: center;
            z-index: 5;
        }
        .rom-loading-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #ffb703;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .rom-status-text { font-size: 12px; font-weight: bold; color: #ffb703; }
        .rom-status-sub { font-size: 10px; opacity: 0.7; }

        /* Controller Pad */
        #pad {
            width: 100%;
            max-width: 440px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 6px 2px;
            position: relative;
            touch-action: none;
        }

        #dpad {
            position: relative;
            width: 136px;
            height: 136px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
        }
        .dpad-btn {
            position: absolute;
            background: #ffb703;
            border: 1.5px solid #d49200;
            color: #100e18;
            font-size: 18px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 3px 0 #946700;
            touch-action: none;
            width: 42px;
            height: 42px;
        }
        .dpad-btn:active, .dpad-btn.touching {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #946700;
            background: #ffa700;
        }
        #dpad-u { top: 6px; left: 47px; }
        #dpad-d { bottom: 6px; left: 47px; }
        #dpad-l { top: 47px; left: 6px; }
        #dpad-r { top: 47px; right: 6px; }

        .mid-ctrls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }
        .pill-btn {
            width: 50px;
            height: 18px;
            background: #3e4c59;
            border: 1px solid #6b8294;
            border-radius: 999px;
            color: #d8e2e8;
            font-size: 8px;
            font-weight: 800;
            letter-spacing: .5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pill-btn:active, .pill-btn.touching {
            background: #ffb703;
            color: #000;
            transform: translateY(1px);
        }

        #act {
            position: relative;
            width: 136px;
            height: 136px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transform: rotate(-20deg);
        }
        .act-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ff2d55;
            box-shadow: 0 4px 10px rgba(255, 45, 85, 0.4);
            cursor: pointer;
            transform: rotate(20deg);
        }
        .act-btn:active, .act-btn.touching {
            transform: rotate(20deg) scale(0.92);
            box-shadow: 0 1px 4px rgba(255, 45, 85, 0.4);
            background: #e01e44;
        }

        @media (orientation: landscape) {
            #hub-view { padding: 14px 20px 36px; }
            #game-view {
                flex-direction: row;
                padding: 8px 16px;
                justify-content: space-around;
            }
            #cabinet {
                max-height: 90vh;
                height: 90vh;
                width: auto;
            }
            #pad {
                width: auto;
                max-width: 100%;
                position: static;
                gap: 36px;
            }
        }

        #exit-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #exit-modal.show { display: flex; }
        .modal-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 18px;
            width: 100%;
            max-width: 290px;
            text-align: center;
            border: 1.5px solid var(--color-line);
        }
        .modal-title { font-size: 15px; font-weight: 800; color: var(--ink); }
        .modal-desc { font-size: 12px; color: var(--color-muted); margin-top: 6px; }
        .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
        .modal-btn-cancel {
            flex: 1; height: 36px; background: var(--color-green-soft); border: 1px solid var(--color-line); border-radius: 10px; font-weight: 700; cursor: pointer;
        }
        .modal-btn-confirm {
            flex: 1; height: 36px; background: #ff2d55; border: none; border-radius: 10px; color: #fff; font-weight: 800; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="hub-view">
            <div class="search-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" class="search-input" id="search-box" placeholder="Cari 490+ game NES..." oninput="filterGames(this.value)">
            </div>

            <div class="cart-grid" id="game-grid"></div>

            <div class="hub-footer">
                <span>🎮 Kanara Arcade · Nintendo NES Hub</span>
            </div>
        </div>

        <div id="game-view">
            <div class="game-top-bar">
                <button type="button" class="btn-ctrl" onclick="promptExitGame()">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
                    EXIT
                </button>
                <div class="game-title-header" id="currentGameTitle">NES Game</div>
                <div class="top-ctrls">
                    <button type="button" class="btn-ctrl" id="top-sel">SELECT</button>
                    <button type="button" class="btn-ctrl" id="top-st">START</button>
                </div>
            </div>

            <div id="cabinet">
                <canvas id="nes" width="256" height="240"></canvas>
                <div class="rom-loading-box" id="romLoadingBox">
                    <div class="rom-loading-spinner"></div>
                    <div class="rom-status-text" id="romStatusText">Mempersiapkan game...</div>
                    <div class="rom-status-sub" id="romStatusSub">Menghubungkan Stream</div>
                </div>
            </div>

            <div id="pad">
                <div id="dpad">
                    <button type="button" class="dpad-btn" id="dpad-u">▲</button>
                    <button type="button" class="dpad-btn" id="dpad-d">▼</button>
                    <button type="button" class="dpad-btn" id="dpad-l">◀</button>
                    <button type="button" class="dpad-btn" id="dpad-r">▶</button>
                </div>

                <div class="mid-ctrls">
                    <button type="button" class="pill-btn" id="sel">SELECT</button>
                    <button type="button" class="pill-btn" id="st">START</button>
                </div>

                <div id="act">
                    <button type="button" class="act-btn" id="btn-b">B</button>
                    <button type="button" class="act-btn" id="btn-a">A</button>
                </div>
            </div>
        </div>
    </div>

    <div id="exit-modal">
        <div class="modal-card">
            <div class="modal-title">Keluar Game?</div>
            <div class="modal-desc">Progres game saat ini tidak disimpan. Kembali ke daftar game?</div>
            <div class="modal-actions">
                <button type="button" class="modal-btn-cancel" onclick="closeExitModal()">Batal</button>
                <button type="button" class="modal-btn-confirm" onclick="confirmExitGame()">Keluar</button>
            </div>
        </div>
    </div>

    <!-- INLINE JSNES EMULATOR ENGINE -->

        function mergeChunks(chunks, totalLength) {
            const merged = new Uint8Array(totalLength);
            let offset = 0;
            for (let i = 0; i < chunks.length; i++) {
                merged.set(new Uint8Array(chunks[i]), offset);
                offset += chunks[i].byteLength;
            }
            return merged;
        }

        function bufferToBase64(uint8Arr) {
            let binary = '';
            const len = uint8Arr.byteLength;
            const chunkSz = 8192;
            for (let i = 0; i < len; i += chunkSz) {
                const slice = uint8Arr.subarray(i, Math.min(i + chunkSz, len));
                binary += String.fromCharCode.apply(null, slice);
            }
            return window.btoa(binary);
        }

        function fetchStreamWs(targetUrl, onProgress, onDone, onError) {
            if (typeof WebSocket === 'undefined') {
                return onError && onError(new Error("No WebSocket API"));
            }
            const wsUrl = WS_PROXY + encodeURIComponent(targetUrl);
            let ws;
            try {
                ws = new WebSocket(wsUrl);
            } catch(e) {
                return onError && onError(e);
            }
            ws.binaryType = "arraybuffer";
            const binaryChunks = [];
            let totalBytes = 0;
            let mimeType = "image/jpeg";
            let finished = false;

            ws.onmessage = function(event) {
                if (typeof event.data === "string") {
                    try {
                        const json = JSON.parse(event.data);
                        if (json.mime) mimeType = json.mime;
                    } catch(e) {}
                    return;
                }
                const bytes = new Uint8Array(event.data);
                if (bytes.length > 0 && bytes[0] === 0x7B) {
                    try {
                        let text = "";
                        for (let i = 0; i < Math.min(bytes.length, 120); i++) text += String.fromCharCode(bytes[i]);
                        const json = JSON.parse(text);
                        if (json.mime) mimeType = json.mime;
                        return;
                    } catch(e) {}
                }

                binaryChunks.push(event.data);
                totalBytes += event.data.byteLength;
                if (onProgress) onProgress(totalBytes);
            };

            function finalize() {
                if (finished) return;
                finished = true;
                if (binaryChunks.length > 0) {
                    const cleanMerged = mergeChunks(binaryChunks, totalBytes);
                    if (onDone) onDone(cleanMerged, mimeType);
                } else {
                    if (onError) onError(new Error("No binary data"));
                }
                try { ws.close(); } catch(e) {}
            }

            ws.onclose = finalize;
            ws.onerror = function(err) {
                if (!finished) {
                    finished = true;
                    if (onError) onError(err);
                }
            };
        }

        const imageB64Cache = new Map();
        let coverObserver = null;

        function loadCoverThumbnail(imgEl, gameId) {
            if (!imgEl) return;
            if (imageB64Cache.has(gameId)) {
                imgEl.src = imageB64Cache.get(gameId);
                imgEl.classList.add("loaded");
                return;
            }

            const coverUrl = CDN_BASE + "covers/" + encodeURIComponent(gameId) + ".jpg";

            // Coba HTTP biasa dulu
            const testImg = new Image();
            testImg.onload = function() {
                imgEl.src = coverUrl;
                imgEl.classList.add("loaded");
                imageB64Cache.set(gameId, coverUrl);
            };
            testImg.onerror = function() {
                // Fallback stream WS Base64
                fetchStreamWs(
                    coverUrl,
                    null,
                    function(cleanUint8, mime) {
                        const b64 = "data:" + (mime || "image/jpeg") + ";base64," + bufferToBase64(cleanUint8);
                        imageB64Cache.set(gameId, b64);
                        imgEl.src = b64;
                        imgEl.classList.add("loaded");
                    },
                    function() {}
                );
            };
            testImg.src = coverUrl;
        }

        function initLazyCovers() {
            if ("IntersectionObserver" in window) {
                if (coverObserver) coverObserver.disconnect();
                coverObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            const gameId = img.getAttribute("data-game-id");
                            if (gameId && !img.src.startsWith("data:image/")) loadCoverThumbnail(img, gameId);
                            coverObserver.unobserve(img);
                        }
                    });
                }, { rootMargin: "150px" });

                document.querySelectorAll("img.lazy-cover").forEach(img => {
                    coverObserver.observe(img);
                });
            } else {
                document.querySelectorAll("img.lazy-cover").forEach(img => {
                    const gameId = img.getAttribute("data-game-id");
                    if (gameId) loadCoverThumbnail(img, gameId);
                });
            }
        }

        function renderGameGrid(list) {
            const grid = document.getElementById("game-grid");
            if (!grid) return;
            let h = "";
            for (let i = 0; i < list.length; i++) {
                const g = list[i];
                const cleanTitle = (g.title || g.id).replace(/'/g, "\\'");
                h += `<button type="button" class="cart" onclick="playGame('${g.id}', '${cleanTitle}')">
                    <div class="cart-window">
                        <div class="cart-placeholder">
                            <svg viewBox="0 0 24 24"><path d="M6 12h4m-2-2v4m7.5-3a.6.6 0 1 0 0 .01M17.5 13a.6.6 0 1 0 0 .01M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z" stroke="#ffb703" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <span>${g.title}</span>
                        </div>
                        <img class="lazy-cover" data-game-id="${g.id}" src="${PRELOADED_COVERS[g.id] || ""}"${PRELOADED_COVERS[g.id] ? " class=\"loaded\"" : ""} alt="${cleanTitle}">
                    </div>
                    <div class="cart-label">
                        <div class="cart-name">${g.title}</div>
                        <div class="cart-meta">NES Retro</div>
                    </div>
                </button>`;
            }
            grid.innerHTML = h;
            initLazyCovers();
        }

        function filterGames(query) {
            const q = query.toLowerCase().trim();
            if (!q) {
                renderGameGrid(ALL_GAMES);
                return;
            }
            const filtered = ALL_GAMES.filter(g => g.title.toLowerCase().includes(q) || g.id.toLowerCase().includes(q));
            renderGameGrid(filtered);
        }

        try {
            renderGameGrid(ALL_GAMES);
        } catch(e) {}

        const cv = document.getElementById('nes');
        const cx = cv ? cv.getContext('2d', { alpha: false, desynchronized: true }) : null;
        const img = cx ? cx.createImageData(256, 240) : null;
        const buf32 = img ? new Uint32Array(img.data.buffer) : null;

        const SAMPLE_RATE = 44100, BUFFER_SIZE = 1024, RING_SIZE = 32768;
        const ringL = new Float32Array(RING_SIZE), ringR = new Float32Array(RING_SIZE);
        let writePtr = 0, readPtr = 0, audioCtx = null, scriptNode = null;
        let nes = null, animId = null;

        function initAudio() {
            if (!audioCtx) {
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) {
                        audioCtx = new AC();
                        scriptNode = audioCtx.createScriptProcessor(BUFFER_SIZE, 0, 2);
                        scriptNode.onaudioprocess = e => {
                            const outL = e.outputBuffer.getChannelData(0), outR = e.outputBuffer.getChannelData(1);
                            const count = (writePtr - readPtr + RING_SIZE) % RING_SIZE;
                            if (count < BUFFER_SIZE) {
                                for (let i = 0; i < outL.length; i++) { outL[i] = 0; outR[i] = 0; }
                                return;
                            }
                            for (let i = 0; i < outL.length; i++) {
                                outL[i] = ringL[readPtr];
                                outR[i] = ringR[readPtr];
                                readPtr = (readPtr + 1) % RING_SIZE;
                            }
                        };
                        scriptNode.connect(audioCtx.destination);
                    }
                } catch (e) {}
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function onAudioSample(l, r) {
            const count = (writePtr - readPtr + RING_SIZE) % RING_SIZE;
            if (count > 4096) {
                readPtr = (readPtr + (count - 1024)) % RING_SIZE;
            }
            ringL[writePtr] = l;
            ringR[writePtr] = r;
            writePtr = (writePtr + 1) % RING_SIZE;
        }

        function startNesWithBinary(binary) {
            const loadingBox = document.getElementById("romLoadingBox");
            if (loadingBox) loadingBox.style.display = "none";

            nes = new jsnes.NES({
                onFrame: fb => {
                    for (let i = 0; i < 61440; i++) buf32[i] = 0xFF000000 | fb[i];
                    cx.putImageData(img, 0, 0);
                },
                onAudioSample: onAudioSample
            });

            nes.loadROM(binary);
            function loop() {
                if (nes) nes.frame();
                animId = requestAnimationFrame(loop);
            }
            animId = requestAnimationFrame(loop);
        }

        function playGame(romName, title) {
            initAudio();
            document.body.classList.add('in-game');
            document.getElementById('hub-view').style.display = 'none';
            document.getElementById('game-view').classList.add('active');
            const titleEl = document.getElementById('currentGameTitle');
            if (titleEl) titleEl.textContent = title || romName;

            const loadingBox = document.getElementById("romLoadingBox");
            const statusText = document.getElementById("romStatusText");
            const statusSub = document.getElementById("romStatusSub");
            if (loadingBox) loadingBox.style.display = "flex";
            if (statusText) statusText.textContent = "Mengunduh ROM...";
            if (statusSub) statusSub.textContent = "Menghubungkan Stream...";

            if (animId) cancelAnimationFrame(animId);

            const romFile = (romName === 'mario' || romName === 'super_mario_bros') ? 'mario.nes' : (romName + '.nes');
            const romTargetUrl = CDN_BASE + 'games/' + encodeURIComponent(romFile);

            fetchStreamWs(
                romTargetUrl,
                function(bytes) {
                    if (statusSub) statusSub.textContent = "Stream: " + (bytes / 1024).toFixed(1) + " KB";
                },
                function(cleanUint8) {
                    if (statusText) statusText.textContent = "Memulai NES...";
                    let binary = "";
                    const len = cleanUint8.byteLength;
                    const chunkSz = 8192;
                    for (let i = 0; i < len; i += chunkSz) {
                        const slice = cleanUint8.subarray(i, Math.min(i + chunkSz, len));
                        binary += String.fromCharCode.apply(null, slice);
                    }
                    startNesWithBinary(binary);
                },
                function() {
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', romTargetUrl, true);
                    xhr.responseType = 'arraybuffer';
                    xhr.onload = function() {
                        if (xhr.status === 200 || xhr.status === 0) {
                            let binary = '';
                            const bytes = new Uint8Array(xhr.response);
                            for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
                            startNesWithBinary(binary);
                        }
                    };
                    xhr.send();
                }
            );
        }

        function promptExitGame() {
            const modal = document.getElementById('exit-modal');
            if (modal) modal.classList.add('show');
        }

        function closeExitModal() {
            const modal = document.getElementById('exit-modal');
            if (modal) modal.classList.remove('show');
        }

        function confirmExitGame() {
            closeExitModal();
            backToHub();
        }

        function backToHub() {
            closeExitModal();
            document.body.classList.remove('in-game');
            document.getElementById('game-view').classList.remove('active');
            if (animId) cancelAnimationFrame(animId);
            nes = null;
            document.getElementById('hub-view').style.display = 'flex';
            renderGameGrid(ALL_GAMES);
            if (cx && buf32) {
                for (let i = 0; i < 61440; i++) buf32[i] = 0xFF000000;
                cx.putImageData(img, 0, 0);
            }
        }

        // 0=A, 1=B, 2=SELECT, 3=START, 4=UP, 5=DOWN, 6=LEFT, 7=RIGHT
        const BTN = {
            'btn-a': 0,
            'btn-b': 1,
            sel: 2,
            st: 3,
            'top-sel': 2,
            'top-st': 3,
            'dpad-u': 4,
            'dpad-d': 5,
            'dpad-l': 6,
            'dpad-r': 7
        };

        Object.keys(BTN).forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            const press = e => {
                if (e.cancelable) e.preventDefault();
                initAudio();
                el.classList.add('touching');
                if (navigator.vibrate) navigator.vibrate(10);
                if (nes) nes.buttonDown(1, BTN[id]);
            };
            const release = e => {
                if (e.cancelable) e.preventDefault();
                el.classList.remove('touching');
                if (nes) nes.buttonUp(1, BTN[id]);
            };
            el.addEventListener('pointerdown', press, { passive: false });
            el.addEventListener('pointerup', release, { passive: false });
            el.addEventListener('pointercancel', release, { passive: false });
            el.addEventListener('pointerleave', release, { passive: false });
            el.addEventListener('touchstart', press, { passive: false });
            el.addEventListener('touchend', release, { passive: false });
            el.addEventListener('touchcancel', release, { passive: false });
        });

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
