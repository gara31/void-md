<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Nintendo Arcade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: #0d0d12;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #app {
            width: 100%;
            max-width: 430px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #15151c;
            position: relative;
        }
        #hub-view {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
        }
        .hub-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 14px;
            border-bottom: 1px solid #282836;
            margin-bottom: 16px;
        }
        .hub-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ff4757;
        }
        .hub-tag {
            font-size: 11px;
            background: #252533;
            color: #8888a0;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }
        .game-btn {
            background: #1c1c26;
            border: 1px solid #2e2e3f;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            padding: 0;
            color: inherit;
            text-align: left;
            font-family: inherit;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-btn:active {
            background: #252533;
            transform: scale(0.98);
        }
        .game-cover {
            width: 100%;
            aspect-ratio: 3/4;
            background: #000;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }
        .game-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
        }
        .game-name {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .game-sub {
            font-size: 10px;
            color: #888899;
        }
        #game-view {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background: #18181f;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-top-nav {
            height: 36px;
            background: #0e0e13;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid #252533;
            flex-shrink: 0;
        }
        .back-btn {
            background: #252533;
            border: 1px solid #3e3e52;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        .current-game-title {
            font-size: 12px;
            font-weight: 700;
            color: #ccc;
        }
        #screen-wrap {
            width: 100%;
            height: 46vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        canvas#nes {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transform: translateZ(0);
            will-change: transform;
        }
        #pad {
            width: 100%;
            flex: 1;
            padding: clamp(8px, 2.5vw, 14px);
            background: #18181f;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            border-top: 2px solid #272733;
            position: relative;
        }
        #top-ctrl {
            display: flex;
            justify-content: center;
            gap: clamp(16px, 4vw, 28px);
            align-items: center;
        }
        #top-ctrl button {
            width: clamp(60px, 18vw, 78px);
            height: clamp(22px, 5.5vw, 28px);
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 14px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .6);
            cursor: pointer;
            color: #fff;
            font-size: clamp(9px, 2.2vw, 11px);
            font-weight: 900;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .06s, background .06s;
        }
        #top-ctrl button:active, #top-ctrl button.touching {
            transform: translateY(2px);
            background: #444;
            box-shadow: 0 0 0 #000;
        }
        #main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px;
            gap: clamp(6px, 2vw, 16px);
        }
        #joystick {
            width: clamp(96px, 29vw, 132px);
            height: clamp(96px, 29vw, 132px);
            border-radius: 50%;
            background: radial-gradient(circle at 50% 42%, #262632, #121217);
            border: 1px solid rgba(255, 255, 255, .12);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, .65), 0 4px 14px rgba(0, 0, 0, .6);
            position: relative;
            flex-shrink: 0;
            touch-action: none;
        }
        #joystick-knob {
            width: 42%;
            height: 42%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 32%, #ff6b78, #b33939);
            border: 1px solid rgba(255, 255, 255, .35);
            box-shadow: 0 3px 8px rgba(0, 0, 0, .65);
            position: absolute;
            top: 29%;
            left: 29%;
            pointer-events: none;
            transition: transform .04s linear;
        }
        #act {
            display: flex;
            gap: clamp(10px, 2.8vw, 16px);
            background: rgba(0, 0, 0, .35);
            padding: clamp(8px, 2.2vw, 12px) clamp(10px, 3vw, 18px);
            border-radius: 36px;
            border: 1px solid rgba(255, 255, 255, .1);
            align-items: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .6);
            flex-shrink: 0;
        }
        #act button {
            width: clamp(44px, 13vw, 58px);
            height: clamp(44px, 13vw, 58px);
            border-radius: 50%;
            border: none;
            color: #fff;
            font-size: clamp(16px, 4.5vw, 20px);
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ff4757;
            box-shadow: 0 4px #b33939;
            cursor: pointer;
            transition: transform .06s, background .06s;
        }
        #act button:active, #act button.touching {
            transform: scale(.92) translateY(3px);
            background: #e84118 !important;
            box-shadow: 0 1px #b33939;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="hub-view">
            <div class="hub-header">
                <div class="hub-title">Nintendo Arcade</div>
                <div class="hub-tag">NES Retro</div>
            </div>
            <div class="game-grid">
                <button type="button" class="game-btn" onclick="playGame('mario', 'Super Mario Bros (1985)')">
                    <img class="game-cover" src="assets/covers/mario.jpg" alt="Mario">
                    <div class="game-info">
                        <div class="game-name">Super Mario Bros</div>
                        <div class="game-sub">Nintendo • 1985</div>
                    </div>
                </button>
                <button type="button" class="game-btn" onclick="playGame('kage', 'The Legend of Kage (1986)')">
                    <img class="game-cover" src="assets/covers/kage.jpg" alt="Kage">
                    <div class="game-info">
                        <div class="game-name">The Legend of Kage</div>
                        <div class="game-sub">Taito • 1986</div>
                    </div>
                </button>
            </div>
        </div>

        <div id="game-view">
            <div class="game-top-nav">
                <button type="button" class="back-btn" onclick="backToHub()">KEMBALI</button>
                <div class="current-game-title" id="game-title">Game</div>
                <div style="width:50px"></div>
            </div>
            <div id="screen-wrap">
                <canvas id="nes" width="256" height="240"></canvas>
            </div>
            <div id="pad">
                <div id="top-ctrl">
                    <button id="sel">SELECT</button>
                    <button id="st">START</button>
                </div>
                <div id="main-row">
                    <div id="joystick">
                        <div id="joystick-knob"></div>
                    </div>
                    <div id="act">
                        <button id="btn-b">B</button>
                        <button id="btn-a">A</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/jsnes.min.js"></script>
    <script>
        const cv = document.getElementById('nes'),
            cx = cv.getContext('2d', { alpha: false, desynchronized: true }),
            img = cx.createImageData(256, 240),
            buf32 = new Uint32Array(img.data.buffer);
        const SAMPLE_RATE = 44100, BUFFER_SIZE = 2048, RING_SIZE = 65536;
        const ringL = new Float32Array(RING_SIZE), ringR = new Float32Array(RING_SIZE);
        let writePtr = 0, readPtr = 0, audioCtx = null, scriptNode = null;
        let nes = null, animId = null;

        function initAudio() {
            if (!audioCtx) {
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) {
                        audioCtx = new AC({ sampleRate: SAMPLE_RATE, latencyHint: 'interactive' });
                        scriptNode = audioCtx.createScriptProcessor(BUFFER_SIZE, 0, 2);
                        scriptNode.onaudioprocess = e => {
                            const outL = e.outputBuffer.getChannelData(0), outR = e.outputBuffer.getChannelData(1);
                            const count = (writePtr - readPtr + RING_SIZE) % RING_SIZE;
                            if (count < BUFFER_SIZE) {
                                for (let i = 0; i < outL.length; i++) { outL[i] = 0; outR[i] = 0; }
                                return;
                            }
                            for (let i = 0; i < outL.length; i++) {
                                outL[i] = ringL[readPtr];
                                outR[i] = ringR[readPtr];
                                readPtr = (readPtr + 1) % RING_SIZE;
                            }
                        };
                        scriptNode.connect(audioCtx.destination);
                    }
                } catch (e) {}
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playGame(romName, titleText) {
            initAudio();
            document.getElementById('hub-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'flex';
            document.getElementById('game-title').textContent = titleText;

            if (animId) cancelAnimationFrame(animId);

            nes = new jsnes.NES({
                onFrame: fb => {
                    for (let i = 0; i < 61440; i++) buf32[i] = 0xFF000000 | fb[i];
                    cx.putImageData(img, 0, 0);
                },
                onAudioSample: (l, r) => {
                    ringL[writePtr] = l;
                    ringR[writePtr] = r;
                    writePtr = (writePtr + 1) % RING_SIZE;
                }
            });

            const xhr = new XMLHttpRequest();
            xhr.open('GET', 'assets/games/' + romName + '.nes', true);
            xhr.responseType = 'arraybuffer';
            xhr.onload = function() {
                if (xhr.status === 200) {
                    let binary = '';
                    const bytes = new Uint8Array(xhr.response);
                    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
                    nes.loadROM(binary);
                    function loop() {
                        if (nes) nes.frame();
                        animId = requestAnimationFrame(loop);
                    }
                    animId = requestAnimationFrame(loop);
                }
            };
            xhr.send();
        }

        function backToHub() {
            if (animId) cancelAnimationFrame(animId);
            nes = null;
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('hub-view').style.display = 'flex';
            for (let i = 0; i < 61440; i++) buf32[i] = 0xFF000000;
            cx.putImageData(img, 0, 0);
        }

        const BTN = {
            'btn-a': jsnes.Controller.BUTTON_A,
            'btn-b': jsnes.Controller.BUTTON_B,
            st: jsnes.Controller.BUTTON_START,
            sel: jsnes.Controller.BUTTON_SELECT
        };

        Object.keys(BTN).forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            const press = e => {
                if (e.cancelable) e.preventDefault();
                initAudio();
                el.classList.add('touching');
                if (navigator.vibrate) navigator.vibrate(12);
                if (nes) nes.buttonDown(1, BTN[id]);
            };
            const release = e => {
                if (e.cancelable) e.preventDefault();
                el.classList.remove('touching');
                if (nes) nes.buttonUp(1, BTN[id]);
            };
            el.addEventListener('pointerdown', press, { passive: false });
            el.addEventListener('pointerup', release, { passive: false });
            el.addEventListener('pointercancel', release, { passive: false });
            el.addEventListener('pointerleave', release, { passive: false });
            el.addEventListener('touchstart', press, { passive: false });
            el.addEventListener('touchend', release, { passive: false });
            el.addEventListener('touchcancel', release, { passive: false });
        });

        const stick = document.getElementById('joystick');
        const knob = document.getElementById('joystick-knob');
        let stickActive = false;
        const dirState = { u: false, d: false, l: false, r: false };
        const DIR_KEY = {
            u: jsnes.Controller.BUTTON_UP,
            d: jsnes.Controller.BUTTON_DOWN,
            l: jsnes.Controller.BUTTON_LEFT,
            r: jsnes.Controller.BUTTON_RIGHT
        };

        function setDir(dir, pressed) {
            if (dirState[dir] === pressed) return;
            dirState[dir] = pressed;
            if (!nes) return;
            if (pressed) nes.buttonDown(1, DIR_KEY[dir]);
            else nes.buttonUp(1, DIR_KEY[dir]);
        }

        function resetStick() {
            knob.style.transform = 'translate(0px, 0px)';
            setDir('u', false);
            setDir('d', false);
            setDir('l', false);
            setDir('r', false);
        }

        function updateStick(clientX, clientY) {
            const rect = stick.getBoundingClientRect();
            const cxp = rect.left + rect.width / 2;
            const cyp = rect.top + rect.height / 2;
            const maxRadius = rect.width / 2;
            let dx = clientX - cxp;
            let dy = clientY - cyp;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            const deadzone = maxRadius * 0.22;
            if (dist < deadzone) {
                setDir('u', false);
                setDir('d', false);
                setDir('l', false);
                setDir('r', false);
                return;
            }
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;
            setDir('u', angle < -22.5 && angle > -157.5);
            setDir('d', angle > 22.5 && angle < 157.5);
            setDir('r', angle > -67.5 && angle < 67.5);
            setDir('l', angle > 112.5 || angle < -112.5);
        }

        stick.addEventListener('pointerdown', e => {
            e.preventDefault();
            initAudio();
            stickActive = true;
            knob.style.transition = 'none';
            stick.setPointerCapture(e.pointerId);
            updateStick(e.clientX, e.clientY);
        }, { passive: false });

        stick.addEventListener('pointermove', e => {
            if (!stickActive) return;
            e.preventDefault();
            updateStick(e.clientX, e.clientY);
        }, { passive: false });

        const endStick = e => {
            if (!stickActive) return;
            stickActive = false;
            knob.style.transition = 'transform .12s ease-out';
            resetStick();
        };
        stick.addEventListener('pointerup', endStick, { passive: false });
        stick.addEventListener('pointercancel', endStick, { passive: false });

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
