<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>Kanara Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background: #000;
            font-family: 'Rubik', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #app {
            width: 100%;
            max-width: 430px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #0f0d16;
            position: relative;
        }

        #hub-view {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: #0f0d16;
        }
        .marquee {
            padding: 22px 18px 16px;
            position: relative;
        }
        .marquee-bulbs {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        .marquee-bulbs span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ffb703;
        }
        .marquee-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 21px;
            line-height: 1.4;
            color: #ff2d55;
            text-shadow: 0 0 10px rgba(255, 45, 85, .45);
        }
        .marquee-sub {
            margin-top: 8px;
            font-size: 13px;
            color: #77748f;
        }
        .cart-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 4px 18px 24px;
        }
        .cart {
            position: relative;
            background: #171325;
            border: 1px solid #2c2740;
            border-radius: 4px 12px 10px 10px;
            padding: 8px 8px 10px;
            cursor: pointer;
            color: inherit;
            text-align: left;
            font-family: inherit;
            user-select: none;
            -webkit-user-select: none;
        }
        .cart::before {
            content: "";
            position: absolute;
            top: -1px;
            left: 14px;
            width: 26px;
            height: 8px;
            background: #0f0d16;
            border: 1px solid #2c2740;
            border-top: none;
            border-radius: 0 0 4px 4px;
        }
        .cart:active {
            background: #1e1930;
        }
        .cart-window {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 3px;
            overflow: hidden;
            background: #000;
            border: 1px solid #322c48;
        }
        .cart-window img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }
        .cart-label {
            margin-top: 9px;
            padding: 7px 8px;
            background: #ff2d55;
            border-radius: 3px;
            pointer-events: none;
        }
        .cart-name {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cart-meta {
            margin-top: 6px;
            font-size: 10px;
            color: #5e5a75;
            letter-spacing: .3px;
            pointer-events: none;
        }

        #rotate-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #0a0910;
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        #lottie-box {
            width: clamp(280px, 80vw, 360px);
            height: clamp(280px, 80vw, 360px);
            margin-bottom: 4px;
        }
        #rotate-overlay .title {
            font-size: 15px;
            font-weight: 800;
            color: #ff2d55;
            margin-bottom: 8px;
            font-family: 'Press Start 2P', monospace;
            line-height: 1.5;
        }
        #rotate-overlay .desc {
            font-size: 13px;
            color: #a09cb5;
            max-width: 280px;
            line-height: 1.4;
        }

        #game-view {
            width: 100vw;
            height: 100vh;
            display: none;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background: #000;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        @media (orientation: portrait) {
            #game-view.active ~ #rotate-overlay,
            body.in-game #rotate-overlay {
                display: flex;
            }
        }

        .top-action-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 38px;
            background: transparent;
            border-bottom: none;
            z-index: 50;
            padding: 6px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .back-btn {
            background: #1c1830;
            border: 1px solid #362f4d;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
        }
        .top-right-ctrl {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .meta-pill {
            height: 28px;
            padding: 0 14px;
            background: #181528;
            border: 1px solid #362f4d;
            border-radius: 14px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .6);
            cursor: pointer;
            color: #b0acca;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .05s, background .05s;
        }
        .meta-pill:active, .meta-pill.touching {
            transform: translateY(2px);
            background: #2e284a;
            color: #fff;
        }

        #cabinet {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            height: 100%;
            aspect-ratio: 256 / 240;
            padding: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        #bezel {
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #screen-wrap {
            width: 100%;
            height: 100%;
            max-height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        canvas#nes {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transform: translateZ(0);
        }

        #pad {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            border-top: none;
            padding: 0;
            pointer-events: none;
            z-index: 20;
        }

        #joystick {
            position: absolute;
            left: clamp(20px, 5vw, 48px);
            bottom: clamp(20px, 5vh, 36px);
            pointer-events: auto;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #171325;
            border: 2px solid #38314f;
            box-shadow: inset 0 3px 12px rgba(0, 0, 0, .8), 0 4px 10px rgba(0, 0, 0, .5);
            touch-action: none;
        }
        #joystick-knob {
            width: 44%;
            height: 44%;
            border-radius: 50%;
            background: #ff2d55;
            border: 1px solid rgba(255, 255, 255, .4);
            box-shadow: 0 4px 12px rgba(0, 0, 0, .8);
            position: absolute;
            top: 28%;
            left: 28%;
            pointer-events: none;
            transition: transform .03s linear;
        }

        #act {
            position: absolute;
            right: clamp(20px, 5vw, 48px);
            bottom: clamp(20px, 5vh, 36px);
            pointer-events: auto;
            width: 140px;
            height: 130px;
        }
        #act button {
            position: absolute;
            border-radius: 50%;
            border: none;
            color: #100e18;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffb703;
            box-shadow: 0 4px #8a6200;
            cursor: pointer;
            transition: transform .05s, box-shadow .05s;
        }
        #act button:active, #act button.touching {
            transform: translateY(3px);
            box-shadow: 0 1px #8a6200;
        }
        #btn-b {
            width: 66px;
            height: 66px;
            font-size: 22px;
            left: 0;
            bottom: 0;
        }
        #btn-a {
            width: 66px;
            height: 66px;
            font-size: 22px;
            right: 0;
            top: 0;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="hub-view">
            <div class="marquee">
                <div class="marquee-bulbs">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="marquee-title">KANARA<br>ARCADE</div>
                <div class="marquee-sub">Pilih cartridge, tekan START</div>
            </div>
            <div class="cart-grid">
                <button type="button" class="cart" onclick="playGame('mario')">
                    <div class="cart-window">
                        <img src="assets/covers/mario.jpg" alt="Mario">
                    </div>
                    <div class="cart-label">
                        <div class="cart-name">Super Mario Bros</div>
                    </div>
                    <div class="cart-meta">Nintendo · 1985</div>
                </button>
                <button type="button" class="cart" onclick="playGame('kage')">
                    <div class="cart-window">
                        <img src="assets/covers/kage.jpg" alt="Kage">
                    </div>
                    <div class="cart-label">
                        <div class="cart-name">The Legend of Kage</div>
                    </div>
                    <div class="cart-meta">Taito · 1986</div>
                </button>
            </div>
        </div>

        <div id="game-view">
            <div class="top-action-bar">
                <button type="button" class="back-btn" onclick="backToHub()">KEMBALI</button>
                <div class="top-right-ctrl">
                    <button type="button" class="meta-pill" id="sel">SELECT</button>
                    <button type="button" class="meta-pill" id="st">START</button>
                </div>
            </div>
            <div id="cabinet">
                <div id="bezel">
                    <div id="screen-wrap">
                        <canvas id="nes" width="256" height="240"></canvas>
                    </div>

            </div>
            <div id="pad">
                <div id="joystick">
                    <div id="joystick-knob"></div>
                </div>
                <div id="act">

                    <button type="button" id="btn-a">A</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script src="assets/js/jsnes.min.js"></script>
    <script>
        const cv = document.getElementById('nes'),
            cx = cv.getContext('2d', { alpha: false, desynchronized: true }),
            img = cx.createImageData(256, 240),
            buf32 = new Uint32Array(img.data.buffer);
        const SAMPLE_RATE = 44100, BUFFER_SIZE = 1024, RING_SIZE = 32768;
        const ringL = new Float32Array(RING_SIZE), ringR = new Float32Array(RING_SIZE);
        let writePtr = 0, readPtr = 0, audioCtx = null, scriptNode = null;
        let nes = null, animId = null;

        function initAudio() {
            if (!audioCtx) {
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) {
                        audioCtx = new AC();
                        scriptNode = audioCtx.createScriptProcessor(BUFFER_SIZE, 0, 2);
                        scriptNode.onaudioprocess = e => {
                            const outL = e.outputBuffer.getChannelData(0), outR = e.outputBuffer.getChannelData(1);
                            const count = (writePtr - readPtr + RING_SIZE) % RING_SIZE;
                            if (count < BUFFER_SIZE) {
                                for (let i = 0; i < outL.length; i++) { outL[i] = 0; outR[i] = 0; }
                                return;
                            }
                            for (let i = 0; i < outL.length; i++) {
                                outL[i] = ringL[readPtr];
                                outR[i] = ringR[readPtr];
                                readPtr = (readPtr + 1) % RING_SIZE;
                            }
                        };
                        scriptNode.connect(audioCtx.destination);
                    }
                } catch (e) {}
            }
            if (audioCtx) {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }
        }

        function onAudioSample(l, r) {
            const count = (writePtr - readPtr + RING_SIZE) % RING_SIZE;
            if (count > 4096) {
                readPtr = (readPtr + (count - 1024)) % RING_SIZE;
            }
            ringL[writePtr] = l;
            ringR[writePtr] = r;
            writePtr = (writePtr + 1) % RING_SIZE;
        }

        function playGame(romName) {
            initAudio();
            document.body.classList.add('in-game');
            document.getElementById('hub-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'flex';
            document.getElementById('game-view').classList.add('active');

            try {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen().catch(() => {});
                }
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                }
            } catch (e) {}

            if (animId) cancelAnimationFrame(animId);

            nes = new jsnes.NES({
                onFrame: fb => {
                    for (let i = 0; i < 61440; i++) buf32[i] = 0xFF000000 | fb[i];
                    cx.putImageData(img, 0, 0);
                },
                onAudioSample: (l, r) => {
                    ringL[writePtr] = l;
                    ringR[writePtr] = r;
                    writePtr = (writePtr + 1) % RING_SIZE;
                }
            });

            const xhr = new XMLHttpRequest();
            xhr.open('GET', 'assets/games/' + romName + '.nes', true);
            xhr.responseType = 'arraybuffer';
            xhr.onload = function() {
                if (xhr.status === 200) {
                    let binary = '';
                    const bytes = new Uint8Array(xhr.response);
                    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
                    nes.loadROM(binary);
                    function loop() {
                        if (nes) nes.frame();
                        animId = requestAnimationFrame(loop);
                    }
                    animId = requestAnimationFrame(loop);
                }
            };
            xhr.send();
        }

        function backToHub() {
            document.body.classList.remove('in-game');
            document.getElementById('game-view').classList.remove('active');
            try {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen().catch(() => {});
                }
            } catch (e) {}

            if (animId) cancelAnimationFrame(animId);
            nes = null;
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('hub-view').style.display = 'flex';
            for (let i = 0; i < 61440; i++) buf32[i] = 0xFF000000;
            cx.putImageData(img, 0, 0);
        }

        const BTN = {
            'btn-a': jsnes.Controller.BUTTON_A,
            'btn-b': jsnes.Controller.BUTTON_B,
            st: jsnes.Controller.BUTTON_START,
            sel: jsnes.Controller.BUTTON_SELECT
        };

        Object.keys(BTN).forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            const press = e => {
                if (e.cancelable) e.preventDefault();
                initAudio();
                el.classList.add('touching');
                if (navigator.vibrate) navigator.vibrate(10);
                if (nes) nes.buttonDown(1, BTN[id]);
            };
            const release = e => {
                if (e.cancelable) e.preventDefault();
                el.classList.remove('touching');
                if (nes) nes.buttonUp(1, BTN[id]);
            };
            el.addEventListener('pointerdown', press, { passive: false });
            el.addEventListener('pointerup', release, { passive: false });
            el.addEventListener('pointercancel', release, { passive: false });
            el.addEventListener('pointerleave', release, { passive: false });
            el.addEventListener('touchstart', press, { passive: false });
            el.addEventListener('touchend', release, { passive: false });
            el.addEventListener('touchcancel', release, { passive: false });
        });

        const stick = document.getElementById('joystick');
        const knob = document.getElementById('joystick-knob');
        let stickActive = false;
        const dirState = { u: false, d: false, l: false, r: false };
        const DIR_KEY = {
            u: jsnes.Controller.BUTTON_UP,
            d: jsnes.Controller.BUTTON_DOWN,
            l: jsnes.Controller.BUTTON_LEFT,
            r: jsnes.Controller.BUTTON_RIGHT
        };

        function setDir(dir, pressed) {
            if (dirState[dir] === pressed) return;
            dirState[dir] = pressed;
            if (!nes) return;
            if (pressed) nes.buttonDown(1, DIR_KEY[dir]);
            else nes.buttonUp(1, DIR_KEY[dir]);
        }

        function resetStick() {
            knob.style.transform = 'translate(0px, 0px)';
            setDir('u', false);
            setDir('d', false);
            setDir('l', false);
            setDir('r', false);
        }

        function updateStick(clientX, clientY) {
            const rect = stick.getBoundingClientRect();
            const cxp = rect.left + rect.width / 2;
            const cyp = rect.top + rect.height / 2;
            const maxRadius = rect.width / 2;
            let dx = clientX - cxp;
            let dy = clientY - cyp;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            const deadzone = maxRadius * 0.22;
            if (dist < deadzone) {
                setDir('u', false);
                setDir('d', false);
                setDir('l', false);
                setDir('r', false);
                return;
            }
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;
            setDir('u', angle < -22.5 && angle > -157.5);
            setDir('d', angle > 22.5 && angle < 157.5);
            setDir('r', angle > -67.5 && angle < 67.5);
            setDir('l', angle > 112.5 || angle < -112.5);
        }

        stick.addEventListener('pointerdown', e => {
            e.preventDefault();
            initAudio();
            stickActive = true;
            knob.style.transition = 'none';
            stick.setPointerCapture(e.pointerId);
            updateStick(e.clientX, e.clientY);
        }, { passive: false });

        stick.addEventListener('pointermove', e => {
            if (!stickActive) return;
            e.preventDefault();
            updateStick(e.clientX, e.clientY);
        }, { passive: false });

        const endStick = e => {
            if (!stickActive) return;
            stickActive = false;
            knob.style.transition = 'transform .1s ease-out';
            resetStick();
        };
        stick.addEventListener('pointerup', endStick, { passive: false });
        stick.addEventListener('pointercancel', endStick, { passive: false });

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
